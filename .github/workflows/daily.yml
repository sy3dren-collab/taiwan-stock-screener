name: Daily official data and Pages

on:
  schedule:
    # 18:30 Asia/Taipei, Monday–Friday. Official empty reports handle holidays.
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Cold-start calendar days (minimum 100; default 180)'
        default: '180'
        required: true
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']

concurrency:
  group: daily-market-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run meaningful offline tests
        run: python -m unittest discover -s tests -v
      - name: Check website JavaScript
        run: node --check site/app.js
      - name: Prepare isolated history checkout
        uses: actions/checkout@v4
        with:
          path: .state
          fetch-depth: 1
      - name: Restore durable history branch
        working-directory: .state
        shell: bash
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote origin refs/heads/market-data)
          if [ -n "$remote_ref" ]; then
            git fetch origin refs/heads/market-data
            git checkout -B market-data FETCH_HEAD
          else
            # Only this disposable secondary checkout is cleared, never the source checkout.
            git checkout --orphan market-data
            git rm -rf --ignore-unmatch .
          fi
      - name: Update official history and screen
        id: update
        continue-on-error: true
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '180' }}
        run: python -m screener update --lookback-days "$LOOKBACK_DAYS"
      - name: Preserve history and diagnostic result
        run: |
          set -euo pipefail
          cp site/results.json .state/latest-results.json
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-results.json
          if [ -f prices.sqlite3 ]; then git add prices.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official market history and screening status"
            git push origin HEAD:market-data
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Record update outcome
        run: |
          echo '### Official market update' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          result = json.load(open('site/results.json'))
          print('Status:', result['status'])
          print('As of:', result.get('as_of'))
          print('Candidates:', len(result['candidates']))
          for error in result.get('errors', []):
              print('Error:', error)
          PY
      - name: Export result
        id: outcome
        env:
          OUTCOME: ${{ steps.update.outcome }}
        run: echo "update_outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
    outputs:
      update_outcome: ${{ steps.outcome.outputs.update_outcome }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish results or explicit source error page
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail run if official data update failed
        if: needs.build.outputs.update_outcome != 'success'
        run: |
          echo 'Official update failed. An explicit error page was deployed; no fake prices were used.' >&2
          exit 1
