name: Daily official data and Pages
on:
  schedule:
    - cron: '30 10 * * 1-5' # 18:30 Asia/Taipei; official no-data reports handle holidays.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'audit_report.md']
concurrency:
  group: official-research-state
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      update_outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regression and execution tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript
        run: |
          node --check site/app.js
          node --check site/naked.js
          node --check site/backtest.js
      - uses: actions/checkout@v4
        with: {path: .history, fetch-depth: 1}
      - name: Restore isolated research state
        run: bash scripts/restore-history.sh
      - name: Update official data and the sole approved strategy
        id: update
        continue-on-error: true
        run: python -m screener.daily screen
      - name: Evidence and paper observation
        run: |
          python -m screener.quality audit
          python -m screener.daily paper --output site/paper.json
      - name: Durable checksummed backup
        run: bash scripts/save-history.sh
      - name: Keep market page on GitHub collection
        run: python -m scripts.configure_premarket
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-diagnostics
          retention-days: 7
          path: |
            site/results.json
            site/data-quality.json
            site/paper.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
      - name: Report source failure after publishing explicit error
        if: needs.build.outputs.update_outcome != 'success'
        run: exit 1
