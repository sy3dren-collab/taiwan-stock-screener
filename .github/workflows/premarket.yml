name: Pre-open markets and news
on:
  schedule:
    - cron: '0 0 * * *' # Daily 08:00 Asia/Taipei; publication can be delayed by Actions.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market/**'
      - 'market_sources.json'
      - 'site/premarket*'
      - 'site/brief-summary.mjs'
      - 'scripts/publish_premarket.mjs'
      - '.github/workflows/premarket.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-research-state
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      source_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/checkout@v4
        with: {path: .history, fetch-depth: 1}
      - run: bash scripts/restore-history.sh
      - name: Collect completed-session quotes and source news
        id: collect
        continue-on-error: true
        run: timeout 180 node scripts/publish_premarket.mjs
      - name: Save reports without rewriting the stock database
        env: {REPORTS_ONLY: 'true'}
        run: bash scripts/save-history.sh
      - name: Keep market page on GitHub collection
        run: python -m scripts.configure_premarket
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-source-diagnostics
          path: site/premarket*.json
  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
      - name: Report source failures after publishing explicit errors
        if: needs.collect.outputs.source_outcome != 'success'
        run: exit 1
